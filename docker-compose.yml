version: '3.8'

services:
  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: corruptor-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/data/stories:/app/app/data/stories # Mount stories for easy update
    restart: always

  # Frontend React (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: corruptor-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always
